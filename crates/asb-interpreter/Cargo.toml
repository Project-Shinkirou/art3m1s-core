[package]
name = "asb-interpreter"
version = "0.2.0"
license = "MPL-2.0"
edition = "2024"

[dependencies]
mlua = { version = "0.12", default-features = false, features = ["luau", "send", "serialize", "vendored"] }
asb-decrypt = { git = "https://github.com/Alphaly2K/asb-decrypt" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
encoding_rs = "0.8"
thiserror = "2.0"
libc = "0.2"