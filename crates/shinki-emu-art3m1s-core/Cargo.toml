[package]
name = "shinki-emu-art3m1s-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MPL-2.0"
build = "build.rs"

[lib]
name = "shinki_emu_art3m1s_core"
crate-type = ["rlib", "cdylib"]
doctest = false

[features]
default = []
static-core = []

[dependencies]
shinki-emu-abi = { git = "https://github.com/Project-Shinkirou/ShinkiEMU", rev = "ddb97dae5ca018d48471527060b6d0bc69e99032", features = ["diagnostic-bridge"] }
art3m1s-core = { path = "../..", default-features = false, features = ["ffmpeg"] }
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shinki-emu-sdk = { git = "https://github.com/Project-Shinkirou/ShinkiEMU", rev = "ddb97dae5ca018d48471527060b6d0bc69e99032", default-features = false, features = ["audio"] }
kira = { version = "0.12", default-features = false, features = ["cpal"] }
tracing = "0.1"
parking_lot = "0.12"

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "android"))'.dependencies]
art3m1s-core = { path = "../..", default-features = false, features = ["vulkan-backend"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
art3m1s-core = { path = "../..", default-features = false, features = ["metal-backend"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
shinki-emu-build = { git = "https://github.com/Project-Shinkirou/ShinkiEMU", rev = "ddb97dae5ca018d48471527060b6d0bc69e99032" }

[package.metadata.shinki]
upstream = "https://github.com/Alphaly2K/art3m1s-core"
upstream_revision = "ad90a62cb192b119b7cf8589aa7f87a94bd747c8"
license_notice = "THIRD_PARTY_NOTICES.md"
modifications = "MODIFICATIONS.md"
