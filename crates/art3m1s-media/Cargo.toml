[package]
name = "art3m1s-media"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[dependencies]
ffmpeg-next = { version = "9.0.0", optional = true, default-features = false, features = [
    "codec",
    "format",
    "software-scaling",
    "software-resampling",
] }

libc = { version = "0.2", optional = true }

[target.'cfg(any(target_os = "android", target_os = "ios", target_os = "macos", target_env = "ohos"))'.dependencies]
ffmpeg-next = { version = "9.0.0", optional = true, default-features = false, features = [
    "codec",
    "format",
    "software-scaling",
    "software-resampling",
    "static",
] }

[features]
ffmpeg = ["dep:ffmpeg-next", "dep:libc"]
